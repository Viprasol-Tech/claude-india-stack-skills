name: Skill request
description: An India-specific task the plugin should handle
labels: [enhancement]
body:
  - type: textarea
    id: task
    attributes:
      label: The task
      description: What are you building or checking, and on which platform (UPI, GST portal / IRP, DigiLocker, an Account Aggregator, a KYC vendor...)?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: Tools, scripts or manual steps (optional).
